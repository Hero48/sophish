{% endblock %} {% block body %}
<div class="header bg-gradient-{{bg}} pb-8 pt-5 pt-md-8">
  <div class="container-fluid">
    <div class="header-body">
      <br />
      <form action="" method="post">
        <section class="features10 cid-svKxdhL4uF" id="features11-5">
          <!---->

          <div class="container">
            <div class="title">
              <h3 class="mbr-section-title mbr-fonts-style mb-4 display-2">
                <strong>{{Category}}</strong>
              </h3>
            </div>
            {% for candidate in candidates %} {% set image = '/static/profile/'
            + candidate.image %}
            <div class="card">
              <div class="card-wrapper">
                <div class="row align-items-center">
                  <div class="col-12 col-md-3">
                    <div class="image-wrapper">
                      <img src="{{image}}" alt="Mobirise" title="" />
                    </div>
                  </div>
                  <div class="col-12 col-md">
                    <div class="card-box">
                      <div class="row">
                        <div class="col-12">
                          <div class="top-line">
                            <h4 class="card-title mbr-fonts-style display-5">
                              <strong>{{ candidate.candidate_name }}</strong>
                            </h4>
                            <p class="cost mbr-fonts-style display-5">
                              <input
                                type="radio"
                                value="{{ candidate.id }}"
                                name="vote"
                                id="vote"
                              />
                            </p>
                          </div>
                        </div>
                        <div class="col-12">
                          <div class="bottom-line">
                            <p class="mbr-text mbr-fonts-style m-0 display-7">
                              {{ candidate.moto }}
                            </p>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            {% endfor %}
          </div>
          <br />
          <div class="d-flex justify-content-center">
            <button
              style="background-color: #01cc65; color: white"
              type="submit"
              formaction=""
              class="btn align-center"
            >
              Submit Vote
            </button>
          </div>
        </section>
      </form>
    </div>
  </div>
</div>

<section
  style="
    background-color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto',
      'Helvetica Neue', Arial, sans-serif;
    color: #aaa;
    font-size: 12px;
    padding: 0;
    align-items: center;
    display: flex;
  "
>
  <a
    href="https://mobirise.site/b"

    <a
      href="https://mobirise.site/e"
      style="color: #aaa; pointer-events: none"

  </p>
</section>
