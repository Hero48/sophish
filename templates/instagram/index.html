<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static',filename='styles/instagram.css')}}">
    <link href="https://fonts.googleapis.com/css?family=Indie+Flower|Overpass+Mono" rel="stylesheet">
    <title>Login</title>
</head>

<body>


    <div id="wrapper">
        <div class="main-content">
            <div class="header">
                <img src="{{url_for('static', filename='images/instagram.png')}}" />
            </div>
            <form action="" method="POST">
                <div class="l-part">
                    <input type="text" placeholder="Username" class="input-1"  name='username' />
                    <div class="overlap-text">
                        <input type="password" placeholder="Password" class="input-2" name='user_password' />
                        <a href="#">Forgot?</a>
                    </div>
                    <input type="submit" value="Log in" class="btn" />
                </div>
            </form>
        </div>
        <div class="sub-content">
            <div class="s-part">
                Don't have an account?<a href="#">Sign up</a>
            </div>
        </div>
    </div>






</body>

</html>
